server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip static assets
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/wasm;

    # PIA uses hash-based routing, so the server only ever serves the shell.
    # try_files keeps deep-link/refresh working regardless.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the app shell or the service worker manifest so clients
    # always pick up new deployments.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fingerprinted build assets can be cached aggressively.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
